name: Scheduled Deploy
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for recent commits
        id: check
        run: |
          LAST_COMMIT=$(git log -1 --format="%ct")
          NOW=$(date +%s)
          DIFF=$((NOW - LAST_COMMIT))
          echo "Last commit timestamp: $LAST_COMMIT"
          echo "Current timestamp: $NOW"
          echo "Difference in seconds: $DIFF"
          if [ $DIFF -le 86400 ]; then
            echo "new_changes=true" >> $GITHUB_OUTPUT
          else
            echo "new_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Vercel Deploy
        if: steps.check.outputs.new_changes == 'true'
        run: curl -X POST https://api.vercel.com/v1/integrations/deploy/prj_vzQbAt5uW96ipBwvh7fWTa3NhjlQ/dKf1bPTprp
